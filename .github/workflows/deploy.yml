# Deploys the Worker that serves auth.planary.ch whenever main changes.
# Needs the repository secret CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template is enough).
# CLOUDFLARE_ACCOUNT_ID is optional; set it if the token can see more than one account.
# Schema changes still go through `npm run db:migrate` by hand, before the code that needs them is merged.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
